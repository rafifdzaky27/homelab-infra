    # Added by homelab-infra (roles/opengym_host): the api routes only GET /api/health, so a
    # monitor that sends HEAD (UptimeRobot free HTTP(s)) got 404. proxy_method turns it into a GET
    # upstream; nginx still answers the HEAD with headers only. Exact match beats the ^~ /api/ block.
    location = ${BASE_PATH}/api/health {
        resolver ${RESOLVER} valid=10s ipv6=off;
        set $api_upstream http://${BACKEND}:${PORT};
        proxy_method GET;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

