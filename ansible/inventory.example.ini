# inventory.example.ini - alamat memakai blok dokumentasi RFC 5737 (192.0.2.0/24).
# Salin ke inventory.local.ini (diabaikan git) dan ganti dengan IP aslimu.
[dns]
srv-dns-01 ansible_host=192.0.2.11

[dns2]
srv-dns-02 ansible_host=192.0.2.12

[proxy]
srv-proxy-01 ansible_host=192.0.2.14

[media_private]
srv-media-private ansible_host=192.0.2.13

[media_shared]
srv-media-shared ansible_host=192.0.2.26

[media:children]
media_private
media_shared

[pitwall]
srv-pitwall-01 ansible_host=192.0.2.25

[fitness]
srv-fit-01 ansible_host=192.0.2.27

[gym]
srv-gym-01 ansible_host=192.0.2.28

[all:vars]
ansible_user=devops
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519_homelab
