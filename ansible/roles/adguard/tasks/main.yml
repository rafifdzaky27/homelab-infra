# roles/adguard/tasks/main.yml
---
- name: Buat direktori konfigurasi
  ansible.builtin.file:
    path: "/opt/adguard/{{ item }}"
    state: directory
    mode: '0755'
  loop: [work, conf]

- name: Pastikan direktori drop-in systemd-resolved ada
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'

- name: Bebaskan port 53 dari systemd-resolved (stub listener saja)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/no-stub.conf
    content: |
      [Resolve]
      DNSStubListener=no
    mode: '0644'
  notify: restart systemd-resolved

- name: Arahkan resolv.conf ke resolver non-stub
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Render konfigurasi AdGuard sebelum container start
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /opt/adguard/conf/AdGuardHome.yaml
    mode: '0640'
  notify: restart adguard

- name: Jalankan AdGuard Home
  community.docker.docker_container:
    name: adguardhome
    image: adguard/adguardhome:v0.107.55
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - /opt/adguard/work:/opt/adguardhome/work
      - /opt/adguard/conf:/opt/adguardhome/conf

- name: Izinkan port DNS dan web UI
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
  loop: ['53', '3000', '80']